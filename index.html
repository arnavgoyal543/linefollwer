<!DOCTYPE html>
<html>
<head>
    <title>Line Follower Bot</title>
    <style>
        body { font-family: Arial; text-align: center; background: #222; color: #fff; }
        video, canvas { border: 2px solid #fff; margin: 10px; }
    </style>
</head>
<body>
    <h1>Line Follower Bot</h1>
    <video id="video" width="320" height="240" autoplay></video>
    <canvas id="processed" width="320" height="240"></canvas>
    <p id="status">Status: Not Connected</p>

    <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('processed');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    // PID constants
    const Kp = 0.5, Ki = 0.0, Kd = 0.1;
    let prevError = 0, integral = 0;

    // ESP32 Wi-Fi IP (ESP32 SoftAP default: 192.168.4.1)
    const ESP32_IP = "192.168.4.1";
    const ESP32_PORT = 80;

    // Request camera access
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => video.srcObject = stream)
    .catch(err => console.error("Camera error:", err));

    // Process each frame
    function processFrame() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        let sumX = 0, count = 0;

        for (let y = 180; y < 240; y++) { // bottom 1/4 of frame
            for (let x = 0; x < 320; x++) {
                const i = (y * 320 + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2];
                const gray = 0.299*r + 0.587*g + 0.114*b;

                if (gray < 60) { // black line threshold
                    sumX += x;
                    count++;
                    // mark detected pixels in red
                    data[i] = 255; data[i+1] = 0; data[i+2] = 0;
                }
            }
        }

        ctx.putImageData(frame, 0, 0);
        return count > 0 ? sumX / count : 160; // center
    }

    // PID and motor speed calculation
    function computeMotorSpeeds(cx) {
        const error = cx - 160;
        integral += error;
        const derivative = error - prevError;
        prevError = error;
        const steering = Kp*error + Ki*integral + Kd*derivative;

        let left = Math.max(0, Math.min(255, 150 - steering));
        let right = Math.max(0, Math.min(255, 150 + steering));
        return {left, right};
    }

    // Send motor speeds to ESP32 via HTTP GET
    async function sendMotorCommand(left, right) {
        const url = `http://${ESP32_IP}:${ESP32_PORT}/set_motors?left=${Math.floor(left)}&right=${Math.floor(right)}`;
        try {
            await fetch(url);
        } catch(e) {
            console.error("HTTP send error:", e);
        }
    }

    // Main loop
    function loop() {
        const cx = processFrame();
        const speeds = computeMotorSpeeds(cx);
        sendMotorCommand(speeds.left, speeds.right);
        requestAnimationFrame(loop);
    }

    loop();
    </script>
</body>
</html>
