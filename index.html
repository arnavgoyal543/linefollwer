<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Line Follower (Maze Solver)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; text-align: center; }
    video, canvas { max-width: 95%; }
    #debug { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>PID Line Follower + Maze Solver</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <div>
    <label>Kp: <input type="number" id="kp" value="0.6" step="0.1"></label>
    <label>Ki: <input type="number" id="ki" value="0" step="0.01"></label>
    <label>Kd: <input type="number" id="kd" value="0.2" step="0.1"></label>
  </div>
  <div id="debug"></div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const dbg = document.getElementById("debug");

// PID variables
let integral = 0, lastError = 0;

// Maze memory
let mazeMap = new Map();
let intersectionId = 0;
let pathStack = [];
let currentIntersection = null;

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => video.srcObject = stream);

function processFrame() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  let W = canvas.width, H = canvas.height;
  let roiH = 40;
  let img = ctx.getImageData(0, H - roiH, W, roiH).data;

  let colHasLine = Array(W).fill(false);
  let sumX = 0, cnt = 0;
  let blobs = 0;

  for (let x = 0; x < W; x++) {
    let colDark = false;
    for (let y = 0; y < roiH; y++) {
      let i = 4 * (y * W + x);
      let r = img[i], g = img[i+1], b = img[i+2];
      let brightness = (r+g+b)/3;
      if (brightness < 80) { // threshold for black line
        colDark = true;
        sumX += x; cnt++;
        break;
      }
    }
    colHasLine[x] = colDark;
  }

  // Count separate blobs (segments of black)
  let inBlob = false;
  for (let x = 0; x < W; x++) {
    if (colHasLine[x] && !inBlob) { blobs++; inBlob = true; }
    if (!colHasLine[x]) inBlob = false;
  }

  let cx = (cnt > 0) ? sumX / cnt : W/2;
  return { cx, seen: cnt>0, W, blobs, colHasLine };
}

function detectIntersection(colHasLine, W) {
  let leftSeen = false, rightSeen = false, centerSeen = false;
  for (let x=0; x<W; x++) {
    if (colHasLine[x]) {
      if (x < W/3) leftSeen = true;
      else if (x > 2*W/3) rightSeen = true;
      else centerSeen = true;
    }
  }
  return { leftSeen, centerSeen, rightSeen };
}

function invert(dir) {
  if (dir === "L") return "R";
  if (dir === "R") return "L";
  if (dir === "F") return "B"; // backward
  return "S";
}

function choosePath(intersection) {
  // Explore unexplored directions first
  for (let dir of ["L","F","R"]) {
    if (intersection.options[dir] && !intersection.visited[dir]) {
      intersection.visited[dir] = true;
      pathStack.push(dir);
      return dir;
    }
  }
  // If all explored → backtrack
  if (pathStack.length > 0) {
    return invert(pathStack.pop());
  }
  return "S"; // stop
}

function sendCmd(cmd) {
  console.log("CMD:", cmd);
}

function step() {
  const {cx, seen, W, blobs, colHasLine} = processFrame();
  let error = (cx - W/2) / (W/2);

  let Kp = parseFloat(document.getElementById("kp").value);
  let Ki = parseFloat(document.getElementById("ki").value);
  let Kd = parseFloat(document.getElementById("kd").value);

  integral += error;
  let derivative = error - lastError;
  lastError = error;
  let output = Kp*error + Ki*integral + Kd*derivative;

  dbg.textContent = `err=${error.toFixed(2)} out=${output.toFixed(2)} `;

  if (!seen) {
    sendCmd("S"); // stop if no line
    dbg.textContent += " GAP STOP";
  } 
  else if (blobs >= 2) {
    // Intersection logic
    const { leftSeen, centerSeen, rightSeen } = detectIntersection(colHasLine, W);

    if (!currentIntersection) {
      currentIntersection = {
        id: intersectionId++,
        options: {L:leftSeen, F:centerSeen, R:rightSeen},
        visited: {L:false, F:false, R:false}
      };
      mazeMap.set(currentIntersection.id, currentIntersection);
    }

    const dir = choosePath(currentIntersection);
    sendCmd(dir);
    dbg.textContent += ` INTERSECTION → ${dir}`;
  } 
  else {
    // Normal PID line following
    if (output > 0.2) sendCmd("R");
    else if (output < -0.2) sendCmd("L");
    else sendCmd("F");
  }

  requestAnimationFrame(step);
}

video.addEventListener("play", () => { step(); });
</script>
</body>
</html>
